[project]
name = "roosterly-agent"
version = "0.1.0"
description = "Support-ticket agent for the Roosterly helpdesk (Nordavo take-home)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
agent = "roosterly_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roosterly_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
